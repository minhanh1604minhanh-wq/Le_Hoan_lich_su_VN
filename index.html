<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÔ HÌNH 3D TƯƠNG TÁC - LÊ HOÀN</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* GIỮ NGUYÊN CSS GỐC VÀ THÊM CÁC NÂNG CẤP BÊN DƯỚI */
        @keyframes pageLoadFade { 0% { opacity: 0; filter: brightness(0) blur(5px); } 100% { opacity: 1; filter: brightness(1) blur(0); } }
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Lora', serif; background: radial-gradient(circle at center, #2a2a2a 0%, #0a0a0a 100%); color: #f4f4f4; animation: pageLoadFade 3s ease-out forwards; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; transition: all 1.5s ease-in-out; }
        
        #intro-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; background: rgba(10, 10, 10, 0.95); transition: opacity 1s ease, visibility 1s ease; }
        .intro-title { font-family: 'Playfair Display', serif; font-size: 3.2rem; color: #e5c158; letter-spacing: 4px; margin-bottom: 20px; text-shadow: 2px 2px 15px rgba(0,0,0,0.9); text-align: center; font-weight: 600; text-transform: uppercase; }

        #player-name-input:focus { box-shadow: 0 0 15px rgba(229, 193, 88, 0.5); }
        
        .lang-container { display: flex; gap: 25px; margin-bottom: 30px; }
        .lang-btn { background: transparent; border: none; color: #8c8c8c; font-family: 'Lora', serif; font-size: 1.1rem; cursor: pointer; letter-spacing: 2px; transition: all 0.3s ease; padding: 5px 10px; position: relative; }
        .lang-btn.active { color: #e5c158; font-weight: 500; border-bottom: 1px solid #e5c158;} 
        #start-btn { background: transparent; border: 1px solid rgba(255, 255, 255, 0.7); color: #ffffff; padding: 14px 40px; border-radius: 30px; font-family: 'Lora', serif; font-size: 1.1rem; cursor: pointer; transition: all 0.4s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        #start-btn:hover { background: #ffffff; color: #0a0a0a; border-color: #ffffff; box-shadow: 0 4px 20px rgba(255,255,255,0.4); }

        #scroll-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9995; display: none; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.9); transition: opacity 1.5s ease; opacity: 0; }
        #parchment { position: relative; width: 85%; max-width: 900px; height: 75%; background: radial-gradient(circle at center, #d4b886 0%, #8b6e45 100%); box-shadow: 0 0 50px rgba(229, 193, 88, 0.2) inset, 0 20px 50px rgba(0,0,0,0.9); border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; text-align: center; padding: 40px; }

        #dust-canvas, #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; transition: opacity 2s ease;}
        #particle-canvas { pointer-events: none; z-index: 3; }

        .instruction-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; text-align: center; pointer-events: none; z-index: 10; transition: opacity 0.8s ease; }
        .highlight-text { font-family: 'Playfair Display', serif; font-size: 2rem; color: #ffeb99; text-shadow: 0 0 20px rgba(0,0,0,1), 2px 2px 5px rgba(0,0,0,1); line-height: 1.5; font-weight: bold; margin-bottom: 20px; }
        .highlight-subtext { font-family: 'Lora', serif; font-size: 1.4rem; color: #ffffff; text-shadow: 0 0 15px rgba(0,0,0,1); line-height: 1.5; }
        #brush-btn { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(10,10,10,0.85); border: 1px solid #e5c158; color: #e5c158; padding: 12px 30px; border-radius: 30px; cursor: pointer; font-size: 1.1rem; font-family: 'Lora', serif; z-index: 20; transition: all 0.3s; }

        #top-controls { position: fixed; top: 30px; right: 30px; display: flex; gap: 15px; z-index: 990; opacity: 0; pointer-events: none; transition: all 0.5s ease; }
        #top-controls.show { opacity: 1; pointer-events: auto; }
        .top-btn { background: rgba(20, 20, 20, 0.6); border: 1px solid rgba(255, 255, 255, 0.2); color: #e5c158; padding: 10px 22px; border-radius: 20px; font-family: 'Lora', serif; font-size: 0.9rem; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.3s ease; }
        
        #main-ui { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 90; opacity: 0; pointer-events: none; transition: opacity 1.2s ease 0.5s; width: 90vw; overflow-x: auto; justify-content: flex-start; padding-bottom: 10px; -ms-overflow-style: none; scrollbar-width: none; }
        #main-ui.show-ui { opacity: 1; pointer-events: auto; }
        .ui-btn { background: rgba(20, 20, 20, 0.75); border: 1px solid rgba(255, 255, 255, 0.2); color: #f4f4f4; padding: 12px 20px; border-radius: 20px; font-family: 'Lora', serif; font-size: 0.95rem; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(5px); white-space: nowrap; flex-shrink: 0; }
        .ui-btn.active-state { border-color: #e5c158; color: #e5c158; background: rgba(30, 30, 30, 0.9); }
        .ai-btn { background: linear-gradient(135deg, #e5c158 0%, #b89224 100%) !important; color: #0a0a0a !important; font-weight: bold; border: none !important; }
        .whatif-btn { background: linear-gradient(135deg, #6c3287 0%, #3f1954 100%) !important; box-shadow: 0 0 15px rgba(108, 50, 135, 0.4); }
        .roleplay-btn { background: linear-gradient(135deg, #b33939 0%, #7a1f1f 100%) !important; color: white!important;}
        @media (min-width: 769px) { #main-ui { width: auto; overflow-x: visible; justify-content: center; } .ui-btn { padding: 15px 25px; font-size: 1rem; } }

        /* OVERLAYS & PANELS CƠ BẢN */
        .overlay-layer { position: fixed; top: 0; left: -100%; width: 380px; height: 100vh; background: rgba(15, 15, 15, 0.92); box-shadow: 5px 0 25px rgba(0,0,0,0.8); z-index: 100; transition: left 0.5s cubic-bezier(0.77, 0, 0.175, 1); padding: 40px 30px; box-sizing: border-box; backdrop-filter: blur(10px); border-right: 1px solid rgba(229, 193, 88, 0.2); overflow-y: auto; }
        .overlay-layer.active { left: 0; }
        .overlay-title { font-family: 'Playfair Display', serif; color: #e5c158; font-size: 1.8rem; margin-bottom: 20px; border-bottom: 1px solid rgba(229, 193, 88, 0.3); padding-bottom: 10px; }
        .overlay-content { font-size: 0.95rem; line-height: 1.7; color: #cdcdcd; text-align: justify;}

        /* AI & GAME PANELS */
        .game-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 500px; max-width: 95vw; background: rgba(20, 20, 20, 0.98); border: 1px solid #e5c158; border-radius: 15px; padding: 30px 25px 25px; box-sizing: border-box; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center; backdrop-filter: blur(15px); max-height: 90vh; overflow-y: auto; }
        .game-panel.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .ai-close-icon { position: absolute; top: 15px; right: 20px; background: none; border: none; color: #8c8c8c; font-size: 1.8rem; cursor: pointer; transition: color 0.3s; padding: 0; }

        .greeting-text { font-style: italic; color: #a894c2; margin-bottom: 10px; font-size: 0.95rem;}
        
        /* THANH TIẾN TRÌNH (PROGRESS BAR) */
        .progress-container { width: 100%; background-color: #333; border-radius: 10px; margin-bottom: 15px; display: none; overflow: hidden; height: 6px; }
        .progress-bar { width: 0%; height: 100%; background-color: #e5c158; transition: width 0.5s ease; box-shadow: 0 0 10px #e5c158; }

        .ai-result-box { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(229, 193, 88, 0.2); border-radius: 8px; padding: 15px; min-height: 60px; margin-bottom: 15px; text-align: justify; color: #dddddd; line-height: 1.6; font-size: 0.95rem; }
        
        #simulation-stats { display: none; justify-content: space-around; background: #000; padding: 15px; border-radius: 10px; border: 1px solid #3f1954; margin-bottom: 15px; }
        .stat-box { text-align: center; } .stat-title { font-size: 0.8rem; color: #a894c2; text-transform: uppercase; margin-bottom: 5px; } .stat-number { font-family: 'Playfair Display', monospace; font-size: 2rem; font-weight: bold; } .stat-success { color: #4CAF50; } .stat-casualty { color: #F44336; }
        
        #aiImageContainer { margin-bottom: 15px; display: none; width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid rgba(229, 193, 88, 0.4); } #aiImageContainer img { width: 100%; height: auto; display: block; }
        
        .prompt-suggestions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 18px; }
        .prompt-chip { background: rgba(229, 193, 88, 0.1); border: 1px solid rgba(229, 193, 88, 0.4); color: #e5c158; padding: 6px 14px; border-radius: 15px; font-size: 0.85rem; font-family: 'Lora', serif; cursor: pointer; transition: all 0.3s; }
        
        .ai-input-group { display: flex; gap: 10px; margin-bottom: 20px; } 
        .ai-text-input { flex: 1; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(229, 193, 88, 0.6); border-radius: 20px; padding: 10px 15px; color: #fff; font-family: 'Lora', serif; font-size: 0.95rem; outline: none; transition: all 0.3s; }
        
        .ai-action-btns { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .ai-panel-btn { padding: 10px 20px; border-radius: 20px; font-family: 'Lora', serif; cursor: pointer; font-size: 0.9rem; border: none; } 
        .btn-confirm { background: rgba(255,255,255,0.2); color: #fff; } 
        .btn-retry { background: #b89224; color: #000; font-weight: bold; }
        .btn-error-retry { background: #b33939; color: white; display: none; } /* Nút Thử lại khi lỗi mạng */
        .btn-export { background: #4CAF50; color: white; display: none; width: 100%; margin-top: 10px;}

        /* KHUNG NHẬP VAI GAME */
        #roleplay-panel { border: 2px solid #b33939; }
        .rp-header { color: #ff6b6b; font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 10px; border-bottom: 1px solid #b33939; padding-bottom: 10px; }
        .rp-npc-box { background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; border-left: 4px solid #e5c158; margin-bottom: 25px; text-align: justify; color: #fff; line-height: 1.6;}
        .rp-options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .rp-option-btn { background: rgba(179, 57, 57, 0.1); border: 1px solid rgba(179, 57, 57, 0.5); color: #ffdada; padding: 15px; border-radius: 8px; font-family: 'Lora', serif; font-size: 1rem; cursor: pointer; text-align: left; }
        .rp-option-btn:hover { border-color: #ff6b6b; transform: translateX(5px); }
        .rp-option-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        /* HIDDEN DIV TO RENDER PDF */
        #pdf-export-container { position: absolute; left: -9999px; top: 0; width: 800px; background: #fff; color: #000; padding: 40px; font-family: 'Lora', serif; }
        .pdf-title { font-size: 24px; color: #b33939; text-align: center; border-bottom: 2px solid #b33939; padding-bottom: 10px; margin-bottom: 20px;}
        .pdf-content { font-size: 16px; line-height: 1.6; text-align: justify;}
    </style>
</head>
<body>
    <audio id="audio-vn" src="le_hoan_tieng_viet.mp3"></audio>
    <audio id="audio-en" src="le_hoan_tieng_anh.mp3"></audio>
    <audio id="sweep-audio" src="sweep.mp3" preload="auto"></audio>
    <audio id="blow-audio" src="blow.mp3" preload="auto"></audio>

    <div id="top-controls"><button id="lang-toggle-btn" class="top-btn">English</button><button id="restart-btn" class="top-btn">Bắt đầu lại</button></div>
    <model-viewer id="myModel" src="Le_Hoan.glb" auto-rotate rotation-per-second="-12deg" camera-orbit="0deg 75deg 140%" camera-target="0m 0m 0m" shadow-intensity="1.5" bounds="tight" min-field-of-view="10deg" max-field-of-view="45deg"></model-viewer>

    <div id="intro-screen">
        <h1 class="intro-title" id="main-title">LÊ HOÀN</h1>
        <input type="text" id="player-name-input" placeholder="Nhập tên của bạn...">
        <div class="lang-container"><button class="lang-btn active" data-lang="vi">VIETNAM</button><button class="lang-btn" data-lang="en">ENGLISH</button></div>
        <button id="start-btn">Bắt Đầu Trải Nghiệm</button>
    </div>

    <div id="scroll-overlay">
        <div id="parchment">
            <div id="secret-text"></div>
            <canvas id="dust-canvas"></canvas><canvas id="particle-canvas"></canvas>
            <div class="instruction-box" id="instruction-box"><p class="highlight-text" id="dust-title"></p><p class="highlight-subtext" id="dust-sub"></p></div>
            <button id="brush-btn"></button>
        </div>
    </div>

    <div id="main-ui">
        <button id="detailBtn" class="ui-btn">Hoàng Đế</button>
        <button id="guideBtn" class="ui-btn">Hướng Dẫn</button>
        <button id="aiBtn" class="ui-btn ai-btn">AI Hỏi Đáp</button>
        <button id="whatifBtn" class="ui-btn whatif-btn">🌌 Đa Vũ Trụ</button>
        <button id="roleplayBtn" class="ui-btn roleplay-btn">🎭 Nhập Vai</button>
    </div>

    <div id="ai-panel" class="game-panel">
        <button class="ai-close-icon" id="aiCloseBtn">&times;</button>
        <div class="greeting-text" id="aiGreeting"></div>
        <div class="ai-status" id="aiStatus">Hệ thống AI đang sẵn sàng</div>
        
        <div class="progress-container" id="ai-progress-container"><div class="progress-bar" id="ai-progress-bar"></div></div>
        
        <div id="simulation-stats">
            <div class="stat-box"><div class="stat-title">Tỉ lệ thành công</div><div class="stat-number stat-success" id="stat-success">0%</div></div>
            <div class="stat-box"><div class="stat-title">Thương vong</div><div class="stat-number stat-casualty" id="stat-casualty">0%</div></div>
        </div>
        <div class="ai-result-box" id="aiResultText">Nhấn nút Mic để nói hoặc gõ câu hỏi vào ô bên dưới.</div>
        <div id="aiImageContainer"><img id="aiVisualImage" src="" alt="Viễn cảnh lịch sử"></div>
        
        <div class="prompt-suggestions" id="promptContainer"></div>
        
        <div class="ai-input-group"><input type="text" id="aiTextInput" class="ai-text-input" placeholder="Nhập câu hỏi..."><button class="ai-panel-btn btn-confirm" id="aiSendTextBtn">Gửi</button></div>
        <div class="ai-action-btns">
            <button class="ai-panel-btn btn-confirm" id="aiConfirmBtn" style="display:none;">Xác nhận Voice</button>
            <button class="ai-panel-btn btn-retry" id="aiRetryBtn">🎙️ Bật Mic</button>
            <button class="ai-panel-btn btn-error-retry" id="aiErrorRetryBtn">🔄 Thử lại mạng</button>
        </div>
        <button class="ai-panel-btn btn-export" id="btnExportWhatIf">📥 Tải Báo Cáo Phân Tích</button>
    </div>

    <div id="roleplay-panel" class="game-panel">
        <button class="ai-close-icon" id="rpCloseBtn">&times;</button>
        <div class="rp-header">HOÀNG ĐẾ LÊ HOÀN</div>
        <div class="greeting-text" id="rpGreeting"></div>
        <div class="rp-turn" id="rp-turn-text">Lượt: 1 / 15</div>
        <div class="progress-container" id="rp-progress-container"><div class="progress-bar" id="rp-progress-bar"></div></div>
        <div class="rp-npc-box" id="rp-npc-text">Đang triệu hồi các quần thần...</div>
        <div class="rp-options" id="rp-options-container"></div>
        <button class="ai-panel-btn btn-error-retry" id="rpErrorRetryBtn">🔄 Kịch bản lỗi. Thử lại?</button>
        <button class="ai-panel-btn btn-export" id="btnExportRoleplay">📥 Xuất Học bạ Điện tử</button>
    </div>

    <div id="overlayDetail" class="overlay-layer"><div class="lang-vi"><h2 class="overlay-title">Lê Hoàn</h2><div class="overlay-content"><p>Lê Hoàn (941 – 1005)...</p></div></div></div>
    <div id="overlayGuide" class="overlay-layer"><div class="lang-vi"><h2 class="overlay-title">Hướng Dẫn</h2><div class="overlay-content"><ul><li>Xoay, Cuộn, Di chuyển</li></ul></div></div></div>

    <div id="pdf-export-container">
        <div class="pdf-title">BÁO CÁO HỌC TẬP LỊCH SỬ - LÊ HOÀN</div>
        <div class="pdf-content" id="pdf-content-box"></div>
    </div>

    <script>
        // ================= BIẾN HỆ THỐNG & ĐA NGÔN NGỮ =================
        const dict = {
            vi: { title: "MÔ HÌNH LÊ HOÀN", startBtn: "Bắt Đầu Trải Nghiệm", restartBtn: "Bắt đầu lại", detailBtn: "Hoàng Đế", guideBtn: "Hướng Dẫn", aiBtn: "AI Hỏi Đáp", closeBtn: "Đóng Lại", aiListening: "Đang lắng nghe...", aiConfirm: "Gửi đi?", placeholder: "Nhập câu hỏi...", btnMicText: "🎙️ Bật Mic", secretText: '"Hãy tìm hiểu tất cả về cuộc đời của ông!"', dustTitle: "Chiếu thư bị phủ đầy bụi thời gian.", dustSub: "Thổi vào micro hoặc quét đi lớp bụi ấy.", brushBtn: "🧹 Dùng chổi quét", prompts: ["Chiến thắng Bạch Đằng?", "Tư tưởng trị quốc?", "Lễ Tịch Điền?"] },
            en: { title: "EMPEROR LE HOAN", startBtn: "Start", restartBtn: "Restart", detailBtn: "Emperor", guideBtn: "Guide", aiBtn: "AI Q&A", closeBtn: "Close", aiListening: "Listening...", aiConfirm: "Send?", placeholder: "Type here...", btnMicText: "🎙️ Mic", secretText: '"Discover his legacy!"', dustTitle: "The scroll is covered in dust.", dustSub: "Blow into the mic or sweep it away.", brushBtn: "🧹 Use Brush", prompts: ["Bach Dang victory?", "Philosophy?", "Tich Dien?"] }
        };

        const body = document.body; const model = document.querySelector('#myModel'); const introScreen = document.querySelector('#intro-screen'); const startBtn = document.querySelector('#start-btn'); const langToggleBtn = document.querySelector('#lang-toggle-btn'); const restartBtn = document.querySelector('#restart-btn'); const playerNameInput = document.querySelector('#player-name-input');
        
        // Quản lý Panel
        const detailBtn = document.querySelector('#detailBtn'); const guideBtn = document.querySelector('#guideBtn'); const aiBtn = document.querySelector('#aiBtn'); const whatifBtn = document.querySelector('#whatifBtn'); const roleplayBtn = document.querySelector('#roleplayBtn');
        const aiPanel = document.querySelector('#ai-panel'); const roleplayPanel = document.querySelector('#roleplay-panel'); const overlayDetail = document.querySelector('#overlayDetail'); const overlayGuide = document.querySelector('#overlayGuide');
        
        // AI Panel Elements
        const aiStatus = document.querySelector('#aiStatus'); const aiResultText = document.querySelector('#aiResultText'); const aiTextInput = document.querySelector('#aiTextInput'); const aiSendTextBtn = document.querySelector('#aiSendTextBtn'); const promptContainer = document.querySelector('#promptContainer'); const aiErrorRetryBtn = document.querySelector('#aiErrorRetryBtn'); const btnExportWhatIf = document.querySelector('#btnExportWhatIf'); const simulationStats = document.querySelector('#simulation-stats');
        
        // RP Elements
        const rpNpcText = document.querySelector('#rp-npc-text'); const rpOptionsContainer = document.querySelector('#rp-options-container'); const rpTurnText = document.querySelector('#rp-turn-text'); const rpErrorRetryBtn = document.querySelector('#rpErrorRetryBtn'); const btnExportRoleplay = document.querySelector('#btnExportRoleplay');
        
        // Audio
        const audioVn = document.querySelector('#audio-vn'); const audioEn = document.querySelector('#audio-en'); const sweepAudio = document.querySelector('#sweep-audio'); const blowAudio = document.querySelector('#blow-audio'); 
        audioVn.volume = 0.15; audioEn.volume = 0.15; sweepAudio.volume = 0.4; blowAudio.volume = 0.7; 
        let isBgAudioPausedForAI = false; let currentTTSAudio = new Audio();
        
        // System variables
        let selectedLang = 'vi'; let playerName = "Người lạ"; let isWhatIfMode = false; let currentAbortController = null; let rpAbortController = null; let typingInterval = null; let recognition = null;
        let lastUserQuery = ""; let whatIfHistory = []; let rpHistory = []; let rpTurn = 1; let progressInterval = null;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; if (SpeechRecognition) { recognition = new SpeechRecognition(); recognition.continuous = false; recognition.interimResults = true; }

        // ================= KHỞI ĐỘNG VÀ LƯU TÊN =================
        window.onload = () => {
            let savedName = localStorage.getItem('lehoan_player_name');
            if(savedName) playerNameInput.value = savedName;
        };

        startBtn.addEventListener('click', async () => {
            if(playerNameInput.value.trim() !== "") {
                playerName = playerNameInput.value.trim();
                localStorage.setItem('lehoan_player_name', playerName);
            }
            sweepAudio.play().then(()=>sweepAudio.pause()).catch(e=>e); blowAudio.play().then(()=>blowAudio.pause()).catch(e=>e); currentTTSAudio.play().then(()=>currentTTSAudio.pause()).catch(e=>e);
            introScreen.style.opacity = '0'; setTimeout(() => { introScreen.style.display = 'none'; startParchmentSequence(); }, 1000);

        async function sendQuestionToChatGPT(question) {
            lastUserQuery = question;
            document.getElementById('aiImageContainer').style.display = 'none'; simulationStats.style.display = 'none'; aiErrorRetryBtn.style.display = 'none'; btnExportWhatIf.style.display = 'none';
            aiStatus.textContent = isWhatIfMode ? "🌌 Đang nạp dữ liệu..." : "Đang kết nối...";
            aiResultText.textContent = "Đang kết nối..."; stopAllAITasks(); currentAbortController = new AbortController();
            
            if(isWhatIfMode) startProgressBar('ai-progress-container', 'ai-progress-bar', 12); // Dụ kiến Đa vũ trụ tốn 12s

            try {
                const endpoint = isWhatIfMode ? '/whatif' : '/ask';
                const payload = isWhatIfMode ? { history: whatIfHistory, scenario: question } : { question: question, lang: selectedLang };
                const response = await fetch(`https://backend-api-le-hoan.onrender.com${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: currentAbortController.signal });
                const data = await response.json();
                stopProgressBar('ai-progress-container', 'ai-progress-bar');

                if (data.error) throw new Error(data.reply);

                if (isWhatIfMode) {
                    whatIfHistory.push({ role: "user", content: question }); whatIfHistory.push({ role: "assistant", content: data.reply });
                    if(whatIfHistory.length >= 2) btnExportWhatIf.style.display = 'block'; // Hiện nút tải báo cáo
                    
                    if (data.successRate !== undefined && data.successRate !== 0) {
                        runSimulationAnimation(data.successRate, data.casualties, async () => {
                            if (data.imageUrl) { document.getElementById('aiVisualImage').src = data.imageUrl; document.getElementById('aiImageContainer').style.display = 'block'; }
                            renderSuggestions(data.suggestions); await fetchAndPlayTTS(data.reply, 'onyx', aiStatus, aiResultText, "Đang nói...");
                        });
                    } else {
                        renderSuggestions(data.suggestions); await fetchAndPlayTTS(data.reply, 'onyx', aiStatus, aiResultText, "Đang nói...");
                    }
                } else {
                    renderSuggestions(data.suggestions); await fetchAndPlayTTS(data.reply, 'onyx', aiStatus, aiResultText, "Đang nói...");
                }
            } catch (error) { 
                if (error.name === 'AbortError') return; 
                stopProgressBar('ai-progress-container', 'ai-progress-bar');
                aiResultText.textContent = "Mất kết nối mạng. Xin hãy thử lại!"; aiStatus.textContent = "Lỗi"; 
                aiErrorRetryBtn.style.display = 'inline-block'; // Hiện nút thử lại
            }
        }

        // ================= XỬ LÝ ÂM THANH BỌC LỖI THÔNG MINH =================
        async function fetchAndPlayTTS(textToSpeak, voiceType, statusElement, textElement, speakingMsg) {
            return new Promise(async (resolve) => {
                if (!textToSpeak) { resolve(); return; }
                const cleanText = textToSpeak.replace(/[*#_]/g, ''); 
                if (!currentAbortController || currentAbortController.signal.aborted) { currentAbortController = new AbortController(); }

                let prefix = "";
                if (textElement && textElement.id === 'rp-npc-text') { prefix = (voiceType === 'onyx') ? `<span style="color:#e5c158; font-weight:bold;">Bệ hạ:</span> ` : `<span style="color:#a894c2; font-weight:bold;">NPC:</span> `; }

                try {
                    const response = await fetch('https://backend-api-le-hoan.onrender.com/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: cleanText, voiceId: voiceType }), signal: currentAbortController.signal });
                    if (!response.ok) { fallbackTypeWriter(textToSpeak, textElement, prefix, resolve); return; }

                    const audioBlob = await response.blob(); const audioUrl = URL.createObjectURL(audioBlob);
                    if (currentTTSAudio) currentTTSAudio.pause(); if (typingInterval) clearInterval(typingInterval); 
                    currentTTSAudio.src = audioUrl; currentTTSAudio.volume = 1.0; 
                    currentTTSAudio.onended = () => { if(statusElement) statusElement.textContent = "Hoàn tất."; resolve(); };
                    currentTTSAudio.onerror = () => { fallbackTypeWriter(textToSpeak, textElement, prefix, resolve); };
                    
                    if(statusElement) statusElement.textContent = speakingMsg; 
                    if(textElement) textElement.innerHTML = prefix; 
                    
                    let playPromise = currentTTSAudio.play();
                    if (playPromise !== undefined) playPromise.catch(e => { fallbackTypeWriter(textToSpeak, textElement, prefix, resolve); });
                    
                    if(textElement) {
                        let i = 0; typingInterval = setInterval(() => { 
                            if (i < textToSpeak.length) { textElement.innerHTML += textToSpeak.charAt(i); i++; textElement.scrollTop = textElement.scrollHeight; } 
                            else { clearInterval(typingInterval); typingInterval = null; resolve(); } 
                        }, 40); 
                    }
                } catch (err) { fallbackTypeWriter(textToSpeak, textElement, prefix, resolve); }
            });
        }

        function fallbackTypeWriter(text, element, prefix, resolve) {
            if (!element) { resolve(); return; }
            if (typingInterval) clearInterval(typingInterval);
            element.innerHTML = prefix; let i = 0;
            typingInterval = setInterval(() => { if (i < text.length) { element.innerHTML += text.charAt(i); i++; element.scrollTop = element.scrollHeight; } else { clearInterval(typingInterval); typingInterval = null; resolve(); } }, 30);
        }

        async function fetchRoleplayTurnData(userChoiceText = null) {
            rpOptionsContainer.innerHTML = ''; rpErrorRetryBtn.style.display = 'none';

        async function handlePlayerChoice(choiceText, event) {
            if(event) event.stopPropagation(); 
            lastUserQuery = choiceText;
            document.querySelectorAll('.rp-option-btn').forEach(b => b.disabled = true);
            rpNpcText.innerHTML = `<span style="color:#e5c158; font-weight:bold;">Bệ hạ:</span> `;

            try {
                const nextTurnPromise = fetchRoleplayTurnData(choiceText);
                await fetchAndPlayTTS(`${choiceText}`, 'onyx', null, rpNpcText, "");
                const data = await nextTurnPromise;
                renderRoleplayTurn(data);
            } catch (err) { if (err.name === 'AbortError') return; stopProgressBar('rp-progress-container', 'rp-progress-bar'); rpNpcText.textContent = "Mất kết nối mạng."; rpErrorRetryBtn.style.display = 'block'; }
        }

        async function renderRoleplayTurn(data) {
            if (data.error) { rpNpcText.textContent = "Hệ thống bị ngắt kết nối."; rpErrorRetryBtn.style.display = 'block'; return; }

            rpHistory.push({ role: "assistant", content: JSON.stringify(data) });
            rpTurnText.textContent = `Lượt: ${rpTurn} / 15`; rpOptionsContainer.innerHTML = '';

            if (data.isGameOver || rpTurn > 15) {
                rpNpcText.innerHTML = `<span style="color:#ff6b6b; font-weight:bold;">KẾT THÚC:</span> ${data.npcDialogue}<br><br><em style="color:#e5c158">${data.endReason}</em>`;
                btnExportRoleplay.style.display = 'block'; // Hiện nút xuất báo cáo
                sendToGoogleSheetsMock(playerName, "Nhập Vai", rpTurn); // Đẩy data mô phỏng
                await fetchAndPlayTTS(data.npcDialogue + ". " + data.endReason, 'alloy', null, null, "");
                return;
            }

            data.choices.forEach((choice) => {
                let cleanChoice = choice.replace(/^([0-9a-zA-ZÀ-ỹ][\.\-\)]\s*)+/g, '').trim(); cleanChoice = cleanChoice.replace(/^-\s*/, '');
                const btn = document.createElement('button'); btn.className = 'rp-option-btn'; btn.textContent = cleanChoice;
                btn.onclick = (e) => handlePlayerChoice(cleanChoice, e);
                rpOptionsContainer.appendChild(btn);
            });

            rpTurn++;
            rpNpcText.innerHTML = `<span style="color:#a894c2; font-weight:bold;">NPC:</span> `;
            await fetchAndPlayTTS(data.npcDialogue, 'alloy', null, rpNpcText, "");
        }
